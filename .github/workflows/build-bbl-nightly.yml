name: Build Patched OrcaSlicer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # Weekly build

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Patched Branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git libgtk-3-dev libboost-all-dev \
            libssl-dev libcurl4-openssl-dev libdbus-1-dev libsecret-1-dev \
            libglew-dev libtbb-dev libeigen3-dev

      - name: Build Slicer
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target OrcaSlicer -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-bbl-build-linux
          path: build/bin/

  build_windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Patched Branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Build Slicer Windows
        shell: pwsh
        run: |
          .\build_release_vs.bat slicer

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-bbl-build-windows
          path: build/OrcaSlicer/
